#version: '3.9'

services:

  db:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: always
    env_file:
      - ./.env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_user_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    volumes:
      - /home/danpalac/data/mysql:/var/lib/mysql
    secrets:
      - db_root_password
      - db_user_password
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$(cat /run/secrets/db_root_password) || exit 1"]
      interval: 10s
      retries: 10


  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: always
    env_file:
      - ./.env
    environment:
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_user_password
      WORDPRESS_ADMIN_PASSWORD_FILE: /run/secrets/db_root_password
    volumes:
      - /home/danpalac/data/wordpress:/var/www/html
    secrets:
      - db_user_password
      - wp_admin_password
    networks:
      - wordpress_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "php-fpm"]
      interval: 30s
      retries: 3
      start_period: 5s
      timeout: 5s

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: always
    env_file:
      - ./.env
    ports:
      - "443:443"
    volumes:
      - /home/danpalac/data/wordpress:/var/www/html
    networks:
      - wordpress_network
    depends_on:
      wordpress:
        condition: service_healthy

# Volumen compartido para secretos
volumes:
  wordpress_data:
    driver: local
  mysql_data:
    driver: local

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_user_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/db_password.txt

networks:
  wordpress_network:
    name: wordpress_network
    driver: bridge
