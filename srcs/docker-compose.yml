#version: '3.1'

services:
  mariadb:
    build: 
      context: .
      dockerfile: ./requirements/mariadb/Dockerfile
    container_name: mariadb
    restart: always
    env_file:
      - ./.env
    volumes:
      - vo_mariadb:/var/lib/mysql
    networks:
      - inception_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  wordpress:
    build: 
      context: . 
      dockerfile: ./requirements/wordpress/Dockerfile
    container_name: wordpress
    depends_on:
      - mariadb
    restart: always
    env_file:
      - ./.env
    volumes:
      - vo_data:/var/www/html
    networks:
      - inception_network
    healthcheck:
      test: ["CMD", "pgrep", "php-fpm"]
      interval: 30s
      retries: 3
      start_period: 5s
      timeout: 5s

  nginx:
    build:
      context: .
      dockerfile: ./requirements/nginx/Dockerfile
    container_name: nginx
    restart: always
    ports:
      - "443:443"   # only TLS/HTTPS
    volumes:
      - vo_data:/var/www/html
      - vo_mariadb:/var/lib/mysql
    networks:
      - inception_network
    depends_on:
      - wordpress

volumes:
  vo_data:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $HOME/data/wordpress
  vo_mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $HOME/data/mysql



networks:
  inception_network:
    driver: bridge