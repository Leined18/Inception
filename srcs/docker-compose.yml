#version: '3.9'

services:

  db:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    env_file:
      - ./.env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_user_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    volumes:
      - ${HOME}/data/mysql:/var/lib/mysql
      - secrets_volume:/run/secrets:ro   # Volumen compartido para contraseñas
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$(cat /run/secrets/db_root_password)"]
      interval: 10s
      retries: 10


  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: always
    env_file:
      - ./.env
    environment:
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_user_password
      WORDPRESS_ADMIN_PASSWORD_FILE: /run/secrets/db_root_password
    volumes:
      - ${HOME}/data/wordpress:/var/www/html
      - secrets_volume:/run/secrets:ro   # Mismo volumen compartido
    networks:
      - wordpress_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "php-fpm"]
      interval: 30s
      retries: 3
      start_period: 5s
      timeout: 5s

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    env_file:
      - ./.env
    ports:
      - "443:443"
    volumes:
      - ${HOME}/data/wordpress:/var/www/html
    networks:
      - wordpress_network
    depends_on:
      wordpress:
        condition: service_healthy

# Volumen compartido para secretos
volumes:
  secrets_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../secrets   # Monta la carpeta ./secrets del host

networks:
  wordpress_network:
    name: wordpress_network
    driver: bridge
