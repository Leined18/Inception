<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada</title>
  <style>
    body { background: #f5f6fa; font-family: 'Segoe UI', Arial, sans-serif; margin:0; }
    .container { max-width: 480px; margin: 60px auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px #0001; padding: 40px 32px; text-align: center; }
    h1 { color: #e84118; font-size: 2.5rem; margin-bottom: 0.5em; }
    p { color: #353b48; font-size: 1.2rem; }
    .btn { display: inline-block; margin-top: 24px; padding: 12px 32px; background: #00a8ff; color: #fff; border-radius: 8px; text-decoration: none; font-weight: bold; transition: background 0.2s; }
    .btn:hover { background: #0097e6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Página no encontrada.<br>¿Quieres volver al inicio?</p>

</html>
